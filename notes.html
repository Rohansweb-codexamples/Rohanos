<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notepad · RohanOS</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell"><section class="app-layout"><div class="topbar"><a class="back" href="index.html">← Desktop</a><h1>Whole Notepad</h1></div><section class="panel"><div class="card-grid"><label>Document title<input id="noteTitle" class="input" placeholder="Project plan"></label><div><p class="muted">Tools</p><p class="row"><button class="button" onclick="addNote()">Save</button><button class="button secondary" onclick="downloadNote()">Export .txt</button><button class="button secondary" onclick="noteBody.value=''">Clear</button></p></div></div><textarea id="noteBody" placeholder="Write notes, plans, docs, or code snippets..."></textarea></section><section class="panel"><h2>Saved documents</h2><div id="notesList" class="list"></div></section></section></main><script src="app.js"></script></body></html>
