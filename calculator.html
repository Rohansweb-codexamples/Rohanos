<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator · RohanOS</title><link rel="stylesheet" href="styles.css"></head><body><main class="phone"><div class="topbar"><a class="back" href="index.html">←</a><h1>Calculator</h1></div><section class="card glass"><input class="input" id="calcDisplay" placeholder="12*(7+3)"><br><br><div class="grid"> <button class="button" onclick="calcDisplay.value+='7'">7</button><button class="button" onclick="calcDisplay.value+='8'">8</button><button class="button" onclick="calcDisplay.value+='9'">9</button><button class="button" onclick="calcDisplay.value+='/'">÷</button><button class="button" onclick="calcDisplay.value+='4'">4</button><button class="button" onclick="calcDisplay.value+='5'">5</button><button class="button" onclick="calcDisplay.value+='6'">6</button><button class="button" onclick="calcDisplay.value+='*'">×</button><button class="button" onclick="calcDisplay.value+='1'">1</button><button class="button" onclick="calcDisplay.value+='2'">2</button><button class="button" onclick="calcDisplay.value+='3'">3</button><button class="button" onclick="calcDisplay.value+='-'">−</button><button class="button" onclick="calcDisplay.value=''">C</button><button class="button" onclick="calcDisplay.value+='0'">0</button><button class="button" onclick="calc(calcDisplay.value)">=</button><button class="button" onclick="calcDisplay.value+='+'">+</button></div></section></main><script src="app.js"></script></body></html>
