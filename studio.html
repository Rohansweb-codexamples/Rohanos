<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Studio · RohanOS</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell"><section class="app-layout"><div class="topbar"><a class="back" href="index.html">← Desktop</a><h1>HTML Studio</h1></div><section class="panel"><div class="card-grid"><label>App name<input id="appName" class="input"></label><label>Author<input id="appAuthor" class="input"></label><label>Description<input id="appDescription" class="input"></label></div><p class="row"><button class="button" onclick="updatePreview()">Run preview</button><button class="button secondary" onclick="saveStudio()">Save draft</button><button class="button secondary" onclick="downloadHtml()">Download .html</button><button class="button" onclick="publishApp()">Publish to store</button></p></section><section class="card-grid"><div class="panel"><h2>Browser-only HTML file</h2><textarea id="htmlCode" spellcheck="false"></textarea></div><div class="panel"><h2>Live app preview</h2><iframe id="preview" class="preview" title="HTML app preview"></iframe></div></section></section></main><script src="app.js"></script></body></html>
